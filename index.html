<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Editor Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ambient-bg"></div>

  <div id="auth-container" class="auth-wrapper" style="display: none;">
    <div class="auth-card">
      <div class="auth-header">
        <svg width="64" height="64" viewBox="0 0 100 100" class="auth-logo">
          <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
              <stop offset="50%" style="stop-color:#7b7fff;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#f5c842;stop-opacity:1" />
            </linearGradient>
          </defs>
          <polygon points="50,10 85,90 15,90" fill="url(#grad1)" />
          <circle cx="50" cy="30" r="8" fill="#fff" opacity="0.8" />
        </svg>
        <h1>Cosmic Editor Academy</h1>
        <p>Premium editing training & recruitment</p>
      </div>

      <div id="login-form" class="auth-form">
        <button id="google-login-btn" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <div class="auth-divider">OR</div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email-input" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password-input" placeholder="••••••••" required>
        </div>

        <button id="login-btn" class="btn btn-primary" style="width: 100%;">Login</button>

        <div class="auth-links">
          <a href="#" id="forgot-password-link">Forgot password?</a>
          <a href="#" id="signup-link">Create account</a>
        </div>

        <div id="auth-error" class="auth-error" style="display: none;"></div>
      </div>

      <div id="signup-form" class="auth-form" style="display: none;">
        <h2>Create Account</h2>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signup-confirm" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signup-username" placeholder="your_username" required>
        </div>

        <button id="signup-btn" class="btn btn-primary" style="width: 100%;">Create Account</button>
        <button id="back-to-login" class="btn btn-ghost" style="width: 100%; margin-top: 10px;">Back to Login</button>
        <div id="signup-error" class="auth-error" style="display: none;"></div>
      </div>

      <div id="reset-form" class="auth-form" style="display: none;">
        <h2>Reset Password</h2>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reset-email" placeholder="your@email.com" required>
        </div>

        <button id="reset-btn" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
        <button id="back-to-login-reset" class="btn btn-ghost" style="width: 100%; margin-top: 10px;">Back to Login</button>
        <div id="reset-message" class="auth-success" style="display: none;"></div>
        <div id="reset-error" class="auth-error" style="display: none;"></div>
      </div>
    </div>
  </div>

  <div id="app-container" style="display: none;">
    <nav id="main-nav" class="main-nav"></nav>
    <main id="main-content" class="main-content"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
